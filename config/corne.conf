# uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# enable zmk studio for realtime keymap updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# enable usb logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y

# show battery percent instead of battery icons
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# disable word per minute widget
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# enable mouse features
CONFIG_ZMK_POINTING=y

# enable custome nice display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# do not show the wpm gauge
CONFIG_NICE_VIEW_GEM_WPM_SHOW_GAUGE=n

# do not animate the gem on the right half
CONFIG_NICE_VIEW_GEM_ANIMATION=n
