CONFIG_ZMKAY_USB_DFU_RESET=y

# Bring up the Zephyr USB device stack + a CDC-ACM port independently of
# CONFIG_ZMK_USB (which is central-only), so the peripheral half gets USB too.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Needed to read the host-requested baud rate (the 1200bps touch).
CONFIG_UART_LINE_CTRL=y
