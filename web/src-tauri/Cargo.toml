[package]
name = "zmkay"
version = "0.0.1"
description = "zmkay — a Vial-style native app for ZMK"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zmkay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# bluest exposes connected_devices_with_services() -> CoreBluetooth
# retrieveConnectedPeripherals, letting us reach the keyboard over its existing
# encrypted system bond (the Studio characteristic requires encryption).
bluest = "0.6"
uuid = "1"
