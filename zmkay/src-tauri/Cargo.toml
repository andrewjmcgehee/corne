[package]
name = "zmkay"
version = "0.0.1"
description = "zmkay — a Vial-style native app for ZMK"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zmkay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parse the user's build.yaml (board/shield/snippet matrix) so the local build
# mirrors GitHub Actions.
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# bluest exposes connected_devices_with_services() -> CoreBluetooth
# retrieveConnectedPeripherals, letting us reach the keyboard over its existing
# encrypted system bond (the Studio characteristic requires encryption).
bluest = "0.6"
uuid = "1"
# Config-folder watcher (debounced) that drives the auto-build pipeline.
notify = "6"
notify-debouncer-mini = "0.4"
# USB serial enumeration (detect connected halves) + the 1200-baud DFU touch.
serialport = "4"

[target.'cfg(unix)'.dependencies]
# kill(-pgid) so canceling a build takes down the whole west/cmake/ninja tree.
libc = "0.2"
